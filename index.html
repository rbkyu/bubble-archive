<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f3f4f9">
<meta name="description" content="只属于你的泡泡存档：把喜欢的艺人消息、图片、视频留在自己手里。">
<title>泡泡存档</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">

  <!-- ============ 首页 ============ -->
  <section class="view" id="view-home">
    <header class="topbar">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.5 11.2c0 3.9-3.8 7-8.5 7-1 0-2-.1-2.9-.4L4.5 20.5l1.3-3.3A6.7 6.7 0 0 1 3.5 11.2c0-3.9 3.8-7 8.5-7s8.5 3.1 8.5 7z"/>
          </svg>
        </div>
        <div>
          <h1>泡泡存档</h1>
          <p id="summary">把喜欢的内容，留在这里</p>
        </div>
      </div>
      <button class="icon-btn" id="btnSync" aria-label="同步到云端">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M17.5 18h-11a4 4 0 0 1-.6-8 5.4 5.4 0 0 1 10.4-.6A3.8 3.8 0 0 1 17.5 18z"/>
          <path d="M12 11v5m0-5 2 2m-2-2-2 2" stroke-width="1.8"/>
        </svg>
      </button>
      <button class="icon-btn" id="btnSettings" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3 1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8 1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>
        </svg>
      </button>
    </header>

    <div class="search-wrap">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        <input id="searchInput" placeholder="搜索艺人或聊天内容" autocomplete="off">
      </div>
    </div>

    <div class="sync-banner" id="syncBanner" hidden></div>
    <div class="empty" id="homeEmpty" hidden>
      <span class="em-ico">🫧</span>
      还没有任何存档<br>先从原 App 复制一段话，或保存一张图<br>再点下面「新建一位艺人」开始
    </div>
    <div class="chat-list" id="chatList"></div>
  </section>

  <!-- ============ 对话页 ============ -->
  <section class="view" id="view-chat" hidden>
    <header class="topbar chat-bar">
      <button class="icon-btn" id="btnBack" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m14.5 5-6.5 7 6.5 7"/></svg>
      </button>
      <div class="chat-head" id="chatHead"></div>
      <button class="icon-btn" id="btnChatMenu" aria-label="更多">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
    </header>
    <div class="msg-list" id="msgList"></div>
    <div class="chat-foot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="10.5" width="16" height="10" rx="3"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
      存档模式 · 只读，内容不会发送到原 App
    </div>
    <button class="fab" id="fabAdd" aria-label="添加存档">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </section>

  <!-- ============ 设置页 ============ -->
  <section class="view" id="view-settings" hidden>
    <header class="topbar">
      <button class="icon-btn" id="btnSetBack" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m14.5 5-6.5 7 6.5 7"/></svg>
      </button>
      <div class="brand">
        <div>
          <h1>设置</h1>
          <p>云端同步、本地存储与备份</p>
        </div>
      </div>
    </header>
    <div class="settings-body" id="settingsBody"></div>
  </section>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-bg"></div>
  <div class="sheet" id="sheet"></div>
</div>

<div class="viewer" id="viewer" hidden>
  <div class="vhead">
    <div class="t" id="vTitle">原文件</div>
    <button id="vDownload" aria-label="下载">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v10m0 0 4-4m-4 4-4-4M5 18.5h14"/></svg>
    </button>
    <button id="vClose" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="vbody" id="vbody"></div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/db.js"></script>
<script src="assets/drive.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
